name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
        env:
          CI: true

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build ai-engine
        working-directory: packages/ai-engine
        run: npm run build
      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - name: Build NestJS API
        working-directory: apps/api
        run: npm run build

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build Next.js
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://kimy-api.onrender.com
